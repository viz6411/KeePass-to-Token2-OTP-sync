[keepassxc]
# Path to your .kdbx database
database_path = "C:/Users/Username/Documents/Passwords.kdbx"

# Optional: path to key file (leave empty if not used)
keyfile_path = ""

# Optional: YubiKey challenge-response slot (e.g. "2")
yubikey_slot = ""

# CLI binary name or absolute path
cli_binary = "keepassxc-cli"

# Group names to exclude from sync
excluded_groups = ["Recycle Bin", "Archive"]

[token2]
# CLI binary name or absolute path (legacy fallback)
cli_binary = "token2-otp-cli"

# Require touch/button press on hardware token to display OTP code (false = standard automatic, true = touch required)
button_required = false
