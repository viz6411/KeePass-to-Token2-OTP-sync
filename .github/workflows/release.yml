name: Release Standalone Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest
        run: pytest

  build:
    name: Build Standalone (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            binary: t2-kpxc-sync.exe
            archive: t2-kpxc-sync-${{ github.ref_name }}-windows-x64.zip
          - os: ubuntu-22.04
            platform: linux
            binary: t2-kpxc-sync
            archive: t2-kpxc-sync-${{ github.ref_name }}-linux-x64.tar.gz

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linux Build Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev libusb-1.0-0-dev libudev-dev

      - name: Install Packaging Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller

      - name: Build Standalone Binary with PyInstaller
        run: pyinstaller t2-kpxc-sync.spec

      - name: Smoke Test Standalone Binary (Linux)
        if: matrix.platform == 'linux'
        run: |
          chmod +x dist/t2-kpxc-sync
          dist/t2-kpxc-sync --help

      - name: Smoke Test Standalone Binary (Windows)
        if: matrix.platform == 'windows'
        run: dist/t2-kpxc-sync.exe --help

      - name: Package Distribution (Linux)
        if: matrix.platform == 'linux'
        run: |
          if [ -f scripts/package_dist.py ]; then
            python scripts/package_dist.py --platform linux --version "${{ github.ref_name }}"
          else
            mkdir -p dist/portable/docs
            cp dist/t2-kpxc-sync dist/portable/
            cp config.example.toml Sync-Token2.sh README.md dist/portable/
            [ -f RELEASE_NOTES_v0.2.0.md ] && cp RELEASE_NOTES_v0.2.0.md dist/portable/ || true
            [ -f docs/architecture.html ] && cp docs/architecture.html dist/portable/docs/ || true
            tar -czvf "dist/${{ matrix.archive }}" -C dist/portable .
          fi

      - name: Package Distribution (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (Test-Path "scripts/package_dist.py") {
            python scripts/package_dist.py --platform windows --version "${{ github.ref_name }}"
          } else {
            $dir = "dist/portable"
            New-Item -ItemType Directory -Force -Path "$dir/docs" | Out-Null
            Copy-Item dist/t2-kpxc-sync.exe $dir/
            Copy-Item config.example.toml, Sync-Token2.bat, README.md $dir/
            if (Test-Path "RELEASE_NOTES_v0.2.0.md") { Copy-Item RELEASE_NOTES_v0.2.0.md $dir/ }
            if (Test-Path "docs/architecture.html") { Copy-Item docs/architecture.html "$dir/docs/" }
            Compress-Archive -Path "$dir/*" -DestinationPath "dist/${{ matrix.archive }}" -Force
          }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-distribution
          path: |
            dist/${{ matrix.binary }}
            dist/${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums (SHA256)
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: true
          prerelease: false
          generate_release_notes: true
