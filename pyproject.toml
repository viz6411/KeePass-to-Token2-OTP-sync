[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "t2-kpxc-sync"
version = "0.2.2"
description = "Secure zero-disk-footprint TOTP synchronization between KeePassXC and Token2 PIN+ hardware keys"
authors = [
    { name = "viz6411" }
]
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0.0",
    "hidapi>=0.14.0",
    "cryptography>=42.0.0",
    "pykeepass>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
t2-kpxc-sync = "t2_kpxc_sync.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
